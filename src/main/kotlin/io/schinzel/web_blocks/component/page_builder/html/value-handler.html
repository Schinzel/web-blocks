<!-- Value handler  -->
{{include: html/value-handler-context.html}}
{{include: html/value-handler-element-support.html}}


<script>
    /**
     * Auto-configures HTMX for value handlers.
     * Finds elements with data-value-handler-id and sets up HTMX attributes
     */
    class ValueHandlerSetup {
        constructor() {
            this.setupValueHandlers()
        }

        setupValueHandlers() {
            // Find all elements with data-value-handler-id
            document.querySelectorAll('[data-value-handler-id]').forEach(element => {
                // Get the id of the value-handler
                const valueHandlerId = element.getAttribute('data-value-handler-id')

                // Check if element type is supported
                if (ElementSupport.isNotSupported(element)) {
                    console.warn(`Unsupported element for value handler '${valueHandlerId}':`, element);
                    return;
                }

                // Set up change event handler
                $(element).on('change', () => {
                    this.handleValueChange(element, valueHandlerId);
                });

                console.log(`Setup value handler: ${valueHandlerId}`)
            })
        }


        /**
         * Handle value change event
         */
        handleValueChange(element, valueHandlerId) {
            // Get the value from the element
            const value = $(element).val();

            // Get context data
            const context = Context.extract(element, valueHandlerId);

            console.log(`Value changed for handler '${valueHandlerId}': ${value}`);

            // Send to server
            this.sendToServer(valueHandlerId, value, context);
        }


        /**
         * Send data to server
         */
        sendToServer(valueHandlerId, value, context) {
            // Prepare the request payload
            const requestData = {
                valueHandlerId: valueHandlerId,
                value: value,
                contextJson: JSON.stringify(context)
            };

            // Send POST request to server
            $.ajax({
                url: '/web-blocks/value-handler',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(requestData),
                success: (response) => {
                    console.log('Server response:', response);
                    // TODO: Handle response
                },
                error: (xhr, status, error) => {
                    console.error('Request failed:', status, error);
                    console.error('Response:', xhr.responseText);
                }
            });
        }
    }

    // When the content of this page has loaded
    document.addEventListener("DOMContentLoaded", () => {
        new ValueHandlerSetup()
    })
</script>
